<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

</head>
<body>
    
    <h1>Simple Calculator</h1>
  
    <input type="number" id="firstNumber" step="any">
    <input type="number" id="secondNumber" step="any">

    <div>
        <button id="Btn1" type="button">Add +</button>
        <button id="Btn2" type="button">Subtract -</button>
        <button id="Btn3" type="button">Multiply ×</button>
        <button id="Btn4" type="button">Divide ÷</button>
    </div>
 
    
    <script src="index.js"></script>
</body>
</html>
