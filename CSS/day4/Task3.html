<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Boxes</title>
    <Style>
        body {
            font-family: arial,sans-serif;
            background-color: rgba(165, 165, 175, 0.822);
        }
        .product {
            width: 250px;
            border: 3px salmon;
            margin: 20px;
            background-color: beige;

        }
       .product1{
        padding: 15px;
        background-color: turquoise;

       }
       .product3{
        padding: 35px;
        background-color: blueviolet;
    
       }
       h2 {
        color:black;

       }
       .price {
        color: crimson;
        font-size: 20px;

       }
    </Style>
</head>

<body>
    <h1>My Products</h1>
    <div class="product product1">
        <h2>laptop</h2>
        <p class="price">₹55,000</p>
        <p>High Perfomance laptop for Students</p>
    </div>
     <div class="product product2">
        <h2>Mobile phone</h2>
        <p class="price">₹25,000</p>
        <p>Powerful smartphone with great camera</p>
    </div> 
    <div class="product product3">
        <h2>Headphone</h2>
        <p class="price">₹2000</p>
        <p>Wireless headphones with clear sound</p>
    </div>
</body>
</html>
