<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
   <header>
    <div class="bg-dark p-5  position-fixed vw-100 shadow-sm">
   <div class="container d-flex text-white justify-content-between align-items-center">
     <div>
    <img src="../asset/orglogo.jpg" style="width:60px";  ="logo">
    </div>
    <div class="d-flex align-items-center gap-5">
     <a href="" class="btn btn-warning">Take a Tour</a>
     <span class="bg-info text-danger p-1 fw-bold rounded-circle">SLA</span>
    </div>
   </div>
   </div>
   </header>
   <section>
    <!-- Bootstrap 5 Carousel -->
<div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">

    <!-- Indicators -->
    <div class="carousel-indicators">
        <button type="button"
                data-bs-target="#heroCarousel"
                data-bs-slide-to="0"
                class="active"
                aria-current="true"
                aria-label="Slide 1"></button>

        <button type="button"
                data-bs-target="#heroCarousel"
                data-bs-slide-to="1"
                aria-label="Slide 2"></button>

        <button type="button"
                data-bs-target="#heroCarousel"
                data-bs-slide-to="2"
                aria-label="Slide 3"></button>

        <button type="button"
                data-bs-target="#heroCarousel"
                data-bs-slide-to="3"
                aria-label="Slide 4"></button>

        <button type="button"
                data-bs-target="#heroCarousel"
                data-bs-slide-to="4"
                aria-label="Slide 5"></button>
    </div>


    <!-- Carousel Images -->
    <div class="carousel-inner">

        <!-- Slide 1 -->
        <div class="carousel-item active">

            <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&fit=crop&w=1600&q=80"
                 class="d-block w-100"
                 alt="Outdoor jackets">

            <!-- Dark overlay -->
            <div class="carousel-caption text-start top-0 bottom-0 start-0 d-flex flex-column justify-content-center align-items-start ps-5">

                <h1 class="fw-bold display-6">
                    Jackets & Fleece
                </h1>

                <p class="fs-5">
                    Conquer any terrain
                </p>

                <p class="fs-4">
                    Upto <strong class="fs-2">60%</strong> Off
                </p>

                <button class="btn btn-light rounded-pill px-4 py-2 fw-bold">
                    SHOP NOW
                </button>

            </div>

        </div>


        <!-- Slide 2 -->
        <div class="carousel-item">

            <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=1600&q=80"
                 class="d-block w-100"
                 alt="Fashion">

            <div class="carousel-caption text-start top-0 bottom-0 start-0 d-flex flex-column justify-content-center align-items-start ps-5">

                <h1 class="fw-bold display-6">
                    New Arrivals
                </h1>

                <p class="fs-5">
                    Explore the latest collection
                </p>

                <p class="fs-4">
                    Upto <strong class="fs-2">50%</strong> Off
                </p>

                <button class="btn btn-light rounded-pill px-4 py-2 fw-bold">
                    SHOP NOW
                </button>

            </div>

        </div>


        <!-- Slide 3 -->
        <div class="carousel-item">

            <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=1600&q=80"
                 class="d-block w-100"
                 alt="Jackets">

            <div class="carousel-caption text-start top-0 bottom-0 start-0 d-flex flex-column justify-content-center align-items-start ps-5">

                <h1 class="fw-bold display-6">
                    Winter Collection
                </h1>

                <p class="fs-5">
                    Stay warm. Stay stylish.
                </p>

                <p class="fs-4">
                    Upto <strong class="fs-2">60%</strong> Off
                </p>

                <button class="btn btn-light rounded-pill px-4 py-2 fw-bold">
                    SHOP NOW
                </button>

            </div>

        </div>


        <!-- Slide 4 -->
        <div class="carousel-item">

            <img src="https://images.unsplash.com/photo-1521292270410-a8c4d716d518?auto=format&fit=crop&w=1600&q=80"
                 class="d-block w-100"
                 alt="Adventure">

            <div class="carousel-caption text-start top-0 bottom-0 start-0 d-flex flex-column justify-content-center align-items-start ps-5">

                <h1 class="fw-bold display-6">
                    Adventure Gear
                </h1>

                <p class="fs-5">
                    Ready for your next journey
                </p>

                <p class="fs-4">
                    Upto <strong class="fs-2">40%</strong> Off
                </p>

                <button class="btn btn-light rounded-pill px-4 py-2 fw-bold">
                    SHOP NOW
                </button>

            </div>

        </div>


        <!-- Slide 5 -->
        <div class="carousel-item">

            <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1600&q=80"
                 class="d-block w-100"
                 alt="Shopping">

            <div class="carousel-caption text-start top-0 bottom-0 start-0 d-flex flex-column justify-content-center align-items-start ps-5">

                <h1 class="fw-bold display-6">
                    Summer Sale
                </h1>

                <p class="fs-5">
                    Discover your style
                </p>

                <p class="fs-4">
                    Upto <strong class="fs-2">70%</strong> Off
                </p>

                <button class="btn btn-light rounded-pill px-4 py-2 fw-bold">
                    SHOP NOW
                </button>

            </div>

        </div>

    </div>


    <!-- Previous -->
    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#heroCarousel"
            data-bs-slide="prev">

        <span class="carousel-control-prev-icon"></span>

        <span class="visually-hidden">
            Previous
        </span>

    </button>


    <!-- Next -->
    <button class="carousel-control-next"
            type="button"
            data-bs-target="#heroCarousel"
            data-bs-slide="next">

        <span class="carousel-control-next-icon"></span>

        <span class="visually-hidden">
            Next
        </span>

    </button>

</div>


<!-- Bootstrap 5 JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   </section>
   



       <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
  


</body>
</html>
